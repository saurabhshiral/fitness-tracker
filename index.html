<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#17150F" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fitness" />
    <meta name="description" content="Personal 12-week recomp training and nutrition tracker" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%icon-192.png" />
    <script>
      // Runs before first paint so the correct theme is already on <html>.
      // Without this the dark default paints for a frame on a light device.
      (function () {
        try {
          var t = JSON.parse(localStorage.getItem('fitness_theme') || '"system"');
          var light = t === 'light' ||
            (t === 'system' && matchMedia('(prefers-color-scheme: light)').matches);
          if (light) document.documentElement.classList.add('light');
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', light ? '#F7F2E9' : '#17150F');
        } catch (e) {}
      })();
    </script>
    <title>Fitness Tracker</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
